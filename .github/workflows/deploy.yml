name: Deploy to S3 + CloudFront

on:
  push:
    branches:
      - master
    paths:
      - 'front/**'
      - '.github/workflows/deploy.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: "contains(github.event.head_commit.message, '[up]')"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        working-directory: ./front
        run: npm install
        
      - name: Build
        working-directory: ./front
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Deploy to S3 (optimized)
        run: |
          # HTML/JS/CSS 등 빌드 산출물은 항상 최신본으로 동기화 (size-only 제거)
          aws s3 sync front/dist/ s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --exclude "pdf/*"

          # index.html은 항상 최신 해시 에셋을 가리키도록 강제 업로드 및 캐시 방지 헤더 설정
          aws s3 cp front/dist/index.html s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8"
            
          # 용량이 큰 PDF 파일만 size-only로 변경분만 동기화
          aws s3 sync front/dist/pdf/ s3://${{ secrets.S3_BUCKET_NAME }}/pdf/ \
            --delete \
            --size-only
          
      - name: Invalidate CloudFront
        run: |
          # 루트(/) 경로를 포함한 전체 캐시 무효화 (와일드카드 1건으로 처리)
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"